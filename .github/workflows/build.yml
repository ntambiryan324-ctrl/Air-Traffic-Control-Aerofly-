name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aerofly-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint gettext libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev cmake

      - name: Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.34"

      - name: Static source checks
        run: |
          python -m py_compile main.py legacy_main.py aviation_features.py pro_ui.py advanced_features.py operations_ui.py efb_frontend.py local_ai_agent.py faa_knowledge.py
          python -m compileall -q main.py legacy_main.py aviation_features.py pro_ui.py advanced_features.py operations_ui.py efb_frontend.py
          python - <<'PY'
          import ast
          for path in ("main.py", "legacy_main.py", "aviation_features.py", "pro_ui.py", "advanced_features.py", "operations_ui.py", "efb_frontend.py", "local_ai_agent.py", "faa_knowledge.py"):
              ast.parse(open(path, encoding="utf-8").read(), filename=path)
          print("Python source checks passed")
          PY

      - name: Build llama.cpp Android runtime
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" || true
          git clone --depth 1 --branch master https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          cmake -S . -B build-android -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DGGML_CPU_KLEIDIAI=ON
          cmake --build build-android --config Release --parallel 2 --target llama-server
          mkdir -p "$GITHUB_WORKSPACE/native/arm64-v8a"
          cp build-android/bin/llama-server "$GITHUB_WORKSPACE/native/arm64-v8a/llama-server"
          chmod 755 "$GITHUB_WORKSPACE/native/arm64-v8a/llama-server"
          ls -lh "$GITHUB_WORKSPACE/native/arm64-v8a/llama-server"

      - name: Build debug APK
        run: |
          rm -rf .buildozer bin
          buildozer -v --debug android debug

      - name: Verify APK
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh bin/*.apk
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Inspect APK package
        run: |
          command -v aapt2 >/dev/null 2>&1 && aapt2 dump badging "$APK" | head -n 20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerofly-flight-companion-debug
          path: bin/*.apk
          if-no-files-found: error
