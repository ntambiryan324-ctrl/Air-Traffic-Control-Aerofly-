name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint gettext libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev cmake

      - name: Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.34"

      - name: Static checks
        run: |
          python -m py_compile main.py aviation_features.py pro_ui.py
          python -m compileall -q main.py aviation_features.py pro_ui.py
          python - <<'PY'
          import ast
          for path in ("main.py", "aviation_features.py", "pro_ui.py"):
              ast.parse(open(path, encoding="utf-8").read(), filename=path)
          print("Python source checks passed")
          PY

      - name: Build debug APK
        env:
          P4A_RELEASE: "master"
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug

      - name: Verify APK
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerofly-flight-companion-debug
          path: bin/*.apk
          if-no-files-found: error
