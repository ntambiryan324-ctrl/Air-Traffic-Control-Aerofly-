name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aerofly-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint gettext libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev cmake

      - name: Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.34"

      - name: Static source checks
        run: |
          python -m py_compile main.py aviation_features.py pro_ui.py advanced_features.py operations_ui.py efb_frontend.py
          python -m compileall -q main.py aviation_features.py pro_ui.py advanced_features.py operations_ui.py efb_frontend.py
          python - <<'PY'
          import ast
          for path in ("main.py", "aviation_features.py", "pro_ui.py", "advanced_features.py", "operations_ui.py", "efb_frontend.py"):
              ast.parse(open(path, encoding="utf-8").read(), filename=path)
          print("Python source checks passed")
          PY

      - name: Build debug APK
        run: |
          rm -rf .buildozer bin
          buildozer -v --debug android debug

      - name: Verify APK
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh bin/*.apk
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Inspect APK package
        run: |
          command -v aapt2 >/dev/null 2>&1 && aapt2 dump badging "$APK" | head -n 20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerofly-flight-companion-debug
          path: bin/*.apk
          if-no-files-found: error
