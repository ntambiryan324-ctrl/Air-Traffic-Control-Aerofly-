name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk             python3-pip autoconf automake autopoint gettext libtool libtool-bin pkg-config zlib1g-dev             libncurses5-dev libncursesw5-dev libtinfo6 libffi-dev libssl-dev cmake

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.2" kivy

      - name: Static syntax check
        run: |
          python -m py_compile main.py aviation_features.py
          python -m compileall -q . -x '(^|/)(.git|.buildozer|bin|build|__pycache__)(/|$)'

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Show APK output
        if: always()
        run: |
          mkdir -p bin
          find bin -maxdepth 1 -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AeroflyATC-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
