name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build AeroflyATC
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential ccache autoconf automake autopoint gettext libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install known-good Buildozer toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.34" "setuptools<81" wheel virtualenv "kivy==2.3.1"
          buildozer --version
          python -c "import Cython; print('Cython', Cython.__version__)"

      - name: Runtime startup structure smoke test
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("main.py").read_text(encoding="utf-8"))
          classes = {n.name: n for n in tree.body if isinstance(n, ast.ClassDef)}
          assert "AeroflyATCApp" in classes, "AeroflyATCApp class missing"
          app = classes["AeroflyATCApp"]
          bases = [b.id for b in app.bases if isinstance(b, ast.Name)]
          assert "App" in bases, f"AeroflyATCApp must inherit App, got {bases}"
          assert any(isinstance(n, ast.FunctionDef) and n.name == "build" for n in app.body), "build() missing"
          compile(Path("main.py").read_text(encoding="utf-8"), "main.py", "exec")
          print("Startup structure smoke test passed.")
          PY

      - name: Validate every Python source file
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files = sorted(pathlib.Path('.').glob('*.py'))
          print('Python files:', [str(p) for p in files])
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print('All Python sources compile successfully.')
          PY

      - name: Run planner and ATC regression tests
        run: python tests/test_core.py

      - name: Generate app icon
        run: python make_icon.py

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          PIP_NO_INPUT: "1"
        run: |
          set -o pipefail
          rm -rf .buildozer bin build.log
          # Build the user's ARM64 APK plus an x86_64 APK for a real emulator launch test.
          sed -i 's/^android.archs = arm64-v8a$/android.archs = arm64-v8a,x86_64/' buildozer.spec
          grep -q '^android.archs = arm64-v8a,x86_64

      - name: Diagnose generated packages
        if: always()
        run: |
          echo "--- workspace packages ---"
          find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.apks' \) -print -exec ls -lh {} \; || true
          echo "--- bin directory ---"
          ls -la bin 2>/dev/null || true
          echo "--- Buildozer tail ---"
          tail -n 120 build.log 2>/dev/null || true

      - name: Verify APK
        run: |
          set -e
          APK="$(find . -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Buildozer produced no APK."
            exit 1
          fi
          echo "APK=$APK"
          ls -lh "$APK"
          command -v aapt >/dev/null 2>&1 && aapt dump badging "$APK" | grep -E "^package:|^launchable-activity:" || true
          unzip -t "$APK" >/dev/null
          echo "APK archive integrity passed."

      - name: Boot Android emulator and verify app startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(find . -type f -name '*.apk' -print -quit)"
            test -n "$APK"
            PACKAGE="org.aeroflycompanion.aeroflyatc"
            echo "Installing $APK on Android API 34 ARM64 emulator"
            adb install "$APK"
            adb shell pm path "$PACKAGE"
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d -v brief > startup-logcat.txt
            if grep -E "FATAL EXCEPTION|Fatal signal [0-9]+|ANR in $PACKAGE|Process: $PACKAGE" startup-logcat.txt; then
              echo "ERROR: Android reported an app crash or ANR during startup."
              exit 1
            fi
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "ERROR: App process is not running after launch."
              tail -n 200 startup-logcat.txt
              exit 1
            fi
            echo "Startup smoke test passed; app process PID=$PID"
      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aerofly-atc-startup-failure-log
          path: startup-logcat.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify APK launches on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(find bin -type f -name '*x86_64*debug.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "ERROR: x86_64 APK required for startup test was not produced."
              find bin -type f -name '*.apk' -print
              exit 1
            fi
            PKG="org.aeroflycompanion.aeroflyatc"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 25
            if ! adb shell pidof "$PKG" >/dev/null; then
              echo "ERROR: app process exited after launch."
              adb logcat -d -t 500
              exit 1
            fi
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|Process: org\\.aeroflycompanion\\.aeroflyatc'; then
              echo "ERROR: Android reported a fatal runtime exception."
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F "$PKG"
            echo "APK installed and remained running on Android emulator."

      - name: Reclaim Actions artifact quota
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' |
            while read -r id; do
              [ -z "$id" ] || gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            done

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aerofly-atc-debug-apk
          path: 'bin/*arm64-v8a-debug.apk'
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="$(find . -type f -name '*.apk' -print -quit)"
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "Aerofly ATC APK build ${GITHUB_RUN_NUMBER}" --notes "Automated debug APK build from commit ${GITHUB_SHA}."
          gh release upload "$TAG" "$APK" --repo "${GITHUB_REPOSITORY}" --clobber
 buildozer.spec
          buildozer -v --debug android debug 2>&1 | tee build.log

      - name: Diagnose generated packages
