name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AeroflyATC
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential ccache autoconf automake autopoint gettext libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install current stable Buildozer/p4a toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0" "cython==0.29.34" "setuptools<81" wheel virtualenv
          buildozer --version
          python -c "import Cython; print('Cython', Cython.__version__)"

      - name: Validate every Python source file
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files = sorted(pathlib.Path('.').glob('*.py'))
          print('Python files:', [str(p) for p in files])
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print('All Python sources compile successfully.')
          PY

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          PIP_NO_INPUT: "1"
        run: |
          set -o pipefail
          rm -rf .buildozer bin build.log
          buildozer -v --debug android debug 2>&1 | tee build.log

      - name: Diagnose generated packages
        if: always()
        run: |
          echo "--- workspace packages ---"
          find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.apks' \) -print -exec ls -lh {} \; || true
          echo "--- bin directory ---"
          ls -la bin 2>/dev/null || true
          echo "--- Buildozer tail ---"
          tail -n 120 build.log 2>/dev/null || true

      - name: Verify APK
        run: |
          APK="$(find . -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Buildozer exited successfully but produced no APK."
            exit 1
          fi
          echo "APK=$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aerofly-atc-debug-apk
          path: '**/*.apk'
          if-no-files-found: error

      # Diagnostics are kept in the job log because the repository's Actions
      # artifact quota is currently exhausted.
