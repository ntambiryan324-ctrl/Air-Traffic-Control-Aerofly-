name: Build Windows EXE

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AeroflyATC for Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      KIVY_GL_BACKEND: angle_sdl2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "kivy[base]==2.3.1" pyinstaller pillow

      - name: Tests
        run: |
          python tests/test_core.py
          python tests/test_suite_features.py

      - name: Build app
        timeout-minutes: 15
        run: |
          python make_icon.py
          pyinstaller --noconfirm --windowed --name AeroflyATC --icon icon.png --add-data "assets;assets" --add-data "icon.png;." main.py

      - name: Build SimBridge (MSFS / GeoFS / X-Plane)
        continue-on-error: true
        run: |
          python -m pip install SimConnect
          pyinstaller --noconfirm --onefile --name SimBridge --collect-all SimConnect bridge/simbridge.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item dist/SimBridge.exe dist/AeroflyATC/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/AeroflyATC/* -DestinationPath AeroflyATC-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AeroflyATC-Windows
          path: AeroflyATC-Windows.zip

      - name: Update rolling latest release (Windows)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest --repo "$GITHUB_REPOSITORY" --title "Latest builds" --notes "Rolling release: newest Android APK and Windows zip built from main." --latest=false || gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload latest AeroflyATC-Windows.zip --repo "$GITHUB_REPOSITORY" --clobber
